name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Build (validates packaging via the hatchling backend)
        run: uv build

      - name: Test
        run: uv run --no-project --python ${{ matrix.python-version }} --with-editable . --with pytest pytest -q
