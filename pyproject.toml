[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmp"
version = "0.0.1a0"
description = "Python reference implementation of PMP (Protocol for Message Passing)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2"]

[tool.hatch.build.targets.wheel]
packages = ["src/pmp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
